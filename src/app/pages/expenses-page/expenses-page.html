<main class="dashboard">
  <header class="topbar">
    <div>
      <span>Ponto Server</span>
      <h1>Despesas</h1>
    </div>
    <nav class="actions">
      @if (user()?.role === 'admin') {
        <a routerLink="/admin/users">Usuarios</a>
      }
      <button type="button" class="secondary" routerLink="/home">Home</button>
      <button type="button" class="secondary" (click)="logout()">Sair</button>
    </nav>
  </header>

  <section class="content">
    <div class="dice-card" aria-live="polite">
      Despesas
    </div>

    <aside class="profile">
      <p>Sessao autenticada</p>
      <strong>{{ user()?.name || 'Usuario' }}</strong>
      <span>{{ user()?.email }}</span>
      <small>{{ user()?.role === 'admin' ? 'Admin' : 'Basic' }}</small>
    </aside>
  </section>
</main>
